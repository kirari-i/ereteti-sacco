<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "utf-8">
        <title>Register - Ereteti Dairy Sacco</title>

    </head>
    <body>
        <header>
            <h1>Apply for membership</h1>
            <p> </p>
        </header>
        <nav>
            <ul>
                <li><a href = "index.html">Home</a></li>
                <li><a href = "about.html">About</a></li>
                <li><a href = "routes.html">Our Routes</a></li>
                <li><a href = "contact.html">Contact</a></li>
                <li><a href = "join.html">Join</a></li>
                <li><a href = "deliveries.html">Deliveries</a></li>
            </ul>
        </nav>
        <main>
            <p>
                <!-- the paragraph from text sheet: who may join-->
            </p>
            <form action = "#"method = "post">
                <fieldset>
                    <legend>Your details</legend>

                    <label for = "first-name">First name</label>
                    <input type = "text" id=" first-name" name = "first_name" required>
                    
                    <label for = "last-name">Last name</label>
                    <input type = "text" id = "last-name" name = "last_name" required>

                    <label for = "national-id">National ID </label>
                    <input type = "text" id = "national-id" name = "national_id" required>

                    <label for = "phone">Phone number</label>
                    <input type = "tel" id = "phone" name = "phone"
                    pattern = "07[0-9]{8}"
                    title = "Ten digits, starting 07"
                    placeholder = "07XXXXXXXX" required>
                </fieldset>
                <fieldset>
                    <legend>Your route</legend>

                    <label for = "route">Route</label>
                    <select id = "route" name = "route" required>
                        <option value = "">Choose a route</option>
                        <option value = "1">Kiserian route</option>
                        <option value = "2">Ngong route</option>
                        <option value = "3">Rongai route</option>
                    </select>
                    <label for = "date-joined">Date of joining</label>
                    <input type = "date" id = "date-joined" name = "date_joined" date = "2026-09-24" required>
                </fieldset>
                    <label for = "rules">
                        <input type = "checkbox" id = "rules" name = "rules"required>
                        I accept the sacco's rules
                    </label>
                    <button type = "submit" value = "Apply to join"</button>                  
                
            </form>
        </main>
    </body>
</html>
